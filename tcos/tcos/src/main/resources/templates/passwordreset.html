<!DOCTYPE html>
<html lang="en" class="light" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <link href="/static/dist/images/logo2.svg" rel="shortcut icon">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>TELCO - Demo</title>
    <link rel="stylesheet" href="/static/dist/css/app.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" />

</head>
<style>
    .dataTables_length select {
        width: 60px;
    }

    /* Hard-coded styles for badges */
    .badge {
        display: inline-block;
        padding: 5px 10px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 5px;
    }

    /* Custom badge styles for "Transferred, InActive and Resigned" status */
    .badge-other {
        color: white;
        background-color: red;
    }

    /* Custom badge styles for "Active" statuses */
    .badge-active {
        color: white;
        background-color: green;
    }
</style>
<!-- END: Head -->

<body class="py-5 md:py-0">
    <div class="flex md:mt-0">

        <div th:replace="~{/fragments/nav}"></div>
        <div th:insert="~{/fragments/mob}"></div>
        <!-- BEGIN: Content -->
        <div class="content content--top-nav">

            <div th:replace="~{/fragments/top}"></div>
            <div class="intro-y flex items-center mt-8">
                <h2 class="text-lg font-medium mr-auto">
                    Change password
                </h2>

            </div>


            <div class="box grid grid-cols-12">
                <div class="col-span-12 lg:col-span-4 px-8 py-12 flex flex-col justify-center">
                    <form th:action="@{/user/resetpassword}" method="post">
                        <div class="mb-4">
                            <label class="block font-medium">Old Password: </label>
                            <input type="password" id="oldpassword" name="oldpassword"
                                class="form-control w-full box pr-10" th:name="oldPassword" required>
                        </div>

                        <div class="mb-4">
                            <label class="block font-medium">New Password: </label>
                            <input type="password" id="newpassword" name="newpassword"
                                class="form-control w-full box pr-10" th:name="newPassword" required disabled>
                        </div>

                        <div class="mb-4">
                            <label class="block font-medium">Confirm New Password: </label>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                class="form-control w-full box pr-10" required disabled>
                        </div>

                        <button class="btn btn-warning w-24 mr-1 mb-2" id="submitBtn" disabled>Change</button>
                    </form>
                </div>

                <div class="col-span-12 lg:col-span-4 px-8 py-12 flex flex-col justify-center">
                    <div class="mb-4">
                        <div id="success" th:if="${success}" style="color: green;" role="alert">
                            <p th:text="${success}"></p>
                        </div>
                        <div  id="error" style="color: red;" role="alert"></div>
                        <div th:if="${error}" style="color: red;" role="alert">
                            <p th:text="${error}"></p>
                        </div>
                    </div>
                </div>

                <div class="col-span-12 lg:col-span-4 px-8 py-12 flex flex-col justify-center">
                    <div class="mb-4">
                        <label class="block font-medium btn-warning">Password must be at least 8 characters long,
                            include uppercase,
                            lowercase, a number, and a special character. </label>
                    </div>
                </div>

            </div>


        </div>

        <script src="/static/dist/js/app.js"></script>
        <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
        <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    </div>

    <div th:insert="~{/fragments/footer}"></div>

</body>
<script>

    function validatePasswordMatch() {
        var password = document.getElementById('newpassword').value.trim();
        var confirmPassword = document.getElementById('confirmPassword').value.trim();
        var errorMessage = document.getElementById('error');
        var submitButton = document.getElementById('submitBtn'); // Ensure this exists

        // Password validation regex
        var passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[@#$%^&+=]).{8,}$/;

        // Check password criteria
        if (!passwordRegex.test(password)) {
            errorMessage.textContent = "Password must be at least 8 characters long, include uppercase, lowercase, a number, and a special character.";
            errorMessage.style.display = 'block';
            if (submitButton) submitButton.disabled = true;
            // console.log("Invalid password");
            return;
        }

        // Check if passwords match
        if (password === confirmPassword && password !== "") {
            errorMessage.textContent = "";
            if (submitButton) submitButton.disabled = false;
            // console.log("Passwords match and are valid");
        } else {
            errorMessage.textContent = "Passwords do not match.";
            errorMessage.style.display = 'block';
            if (submitButton) submitButton.disabled = true;
            // console.log("Passwords do not match");
        }
    }

    
    document.getElementById('newpassword').addEventListener('input', validatePasswordMatch);
    document.getElementById('confirmPassword').addEventListener('input', validatePasswordMatch);

    $(document).ready(function(){
        $('#oldpassword').on('input', function (){
            var oldpassword=$('#oldpassword').val();
            $.ajax({
                url:"/user/passcheck?password="+oldpassword,
                type:'GET',
                success: function(result){
                    if(!result.samePass){
                        $('#error').text('The old password does not match. Try again!');
                        $('#oldpassword').focus();
                        $('#submitBtn').attr("disabled",true);
                    } else {
                        $('#error').text('');
                        // $('#submitBtn').attr("disabled",false);
                        $('#oldpassword').attr("readonly",true);
                        $('#newpassword').attr("disabled",false);
                        $('#confirmPassword').attr("disabled",false);
                    }
                },
                error: function(){
                    alert('Error checking old password. Try again!');
                }
            });

        });
    });


</script>

</html>
