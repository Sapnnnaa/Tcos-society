<!DOCTYPE html>
<html lang="en" class="light" xmlns:th="http://www.w3.org/1999/xhtml">
<!-- BEGIN: Head -->
<head>
    <meta charset="utf-8">
    <link href="/tcos/dist/images/logo2.svg" rel="shortcut icon">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Commodity Loan</title>
    <link rel="stylesheet" href="/tcos/dist/css/app.css"/>
    <link rel="stylesheet" href="/tcos/dist/css/jquery.dataTables1.13.5.min.css">
    <script src="/tcos/dist/js/jquery-3.6.0.min.js"></script>
    <script src="/tcos/dist/js/jquery.dataTables1.13.5.min.js"></script>
    <!-- END: CSS Assets-->
</head>
<body class="py-5">
<!-- BEGIN: Mobile Menu -->
<div th:insert="~{./fragments/mob}"></div>
<!-- END: Mobile Menu -->
<div class="flex mt-[4.7rem] md:mt-0">
    <div th:replace="~{./fragments/nav}"></div>
    <div class="content">
        <div th:replace="~{./fragments/top}"></div>
        <div class="intro-y flex justify-between mt-6">
            <div class="flex-1">
                <h2 class="text-2xl font-bold">APPROVED COMMODITY LOAN</h2>
            </div>
            <!-- Div with the button on the right -->
            <div class="flex items-center justify-end space-x-2 ml-3 mt-2">
                <div class="text-left">
                    <div class="flex mr-2 items-center">
                        <div class="font-medium">Filter Approved Date:-</div>
                    </div>
                </div>
                <div>
                    <label for="minDate">From:</label>
                    <input type="date" id="minDate" class="border p-2 rounded">

                    <label for="maxDate" class="ml-2">To:</label>
                    <input type="date" id="maxDate" class="border p-2 rounded">
                </div>
            </div>
        </div>
        <div class="grid grid-cols-12 gap-6 mt-5 p-5 bg-white shadow-lg rounded-2xl">
            <div class="intro-y col-span-12 overflow-auto 2xl:overflow-visible">
                <table class="table table-report -mt-2" id="table">
                    <thead>
                    <tr>
                        <th class="whitespace-nowrap">Ticket Number</th>
                        <th class="whitespace-nowrap">Member Name</th>
                        <th class="whitespace-nowrap">Company Name</th>
                        <th class="whitespace-nowrap">Loan Type</th>
                        <th class="whitespace-nowrap">Loan Amount</th>
                        <th class="whitespace-nowrap">Status</th>
                        <th class="whitespace-nowrap">Apply Date</th>
                        <th class="whitespace-nowrap">Approved Date</th>
                        <th class="whitespace-nowrap">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="loan : ${loans}">
                        <td th:text="${loan.userId}"></td>
                        <td th:text="${loan.Name}"></td>
                        <td th:text="${loan.companyId}"></td>
                        <td th:text="${loan.loanType.name()}"></td>
                        <td th:text="${loan.loanAmount}"></td>
                        <td th:text="${loan.loanStatus}"></td>
                        <td th:text="${loan.createdAt}"></td>
                        <td th:text="${loan.loanApproveDate}"></td>
                        <td>
                            <a th:href="@{/members/loan/commodityLoan/details/{Id}(Id=${loan.id})}" class="btn btn-primary flex items-center"><i data-lucide="check-square" class="w-4 h-4 mr-1"></i>Details</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{./fragments/footer}"></div>
<script src="/tcos/dist/js/app.js"></script>
<script src="/tcos/dist/js/jquery-3.7.0.min.js"></script>
<script src="/tcos/dist/js/jquery.dataTables1.13.5.min.js"></script>
<script>
    $(document).ready(function () {
        var table = $('#table').DataTable({
            columnDefs: [
                {
                    targets: [6,7], // Updated Date column (0-based index)
                    render: function (data, type, row) {
                        if (!data) return '';
                        var date = new Date(data); // raw ISO yyyy-MM-dd
                        return date.toLocaleDateString('en-GB'); // dd/MM/yyyy
                    }
                }
            ]
        });

        // Filtering by date range
        $.fn.dataTable.ext.search.push(
            function (settings, data, dataIndex) {
                var min = $('#minDate').val();
                var max = $('#maxDate').val();
                var minDate = min ? new Date(min) : null;
                var maxDate = max ? new Date(max) : null;

                // Get raw ISO value from row (still yyyy-MM-dd)
                var rowData = table.row(dataIndex).data();
                var rowDateStr = rowData[7];
                var rowDate = rowDateStr ? new Date(rowDateStr) : null;

                if (!rowDate) return false;
                if (minDate && rowDate < minDate) return false;
                if (maxDate && rowDate > maxDate) return false;

                return true;
            }
        );

        $('#minDate, #maxDate').on('change', function () {
            table.draw();
        });
    });
</script>
</body>
</html>
