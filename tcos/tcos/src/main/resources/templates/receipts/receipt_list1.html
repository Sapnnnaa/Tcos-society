<!DOCTYPE html>
<html lang="en" class="light" xmlns:th="http://www.w3.org/1999/xhtml">
<!-- BEGIN: Head -->

<head>
    <meta charset="utf-8">
    <link href="/tcos/dist/images/logo2.svg" rel="shortcut icon">
    <title>Create Receipt</title>
    <!-- BEGIN: CSS Assets-->
    <link rel="stylesheet" href="/tcos/dist/css/app.css" />
    <link rel="stylesheet" href="/tcos/dist/css/jquery.dataTables1.13.5.min.css">
    <script src="/tcos/dist/js/jquery-3.6.0.min.js"></script>
<!--    <script src="/tcos/dist/js/jquery.dataTables.min.js"></script>-->
    <!-- END: CSS Assets-->
</head>

<body class="overflow-x-auto py-5">
<!-- BEGIN: Mobile Menu -->

<!-- END: Mobile Menu -->
<div class="flex mt-[4.7rem] md:mt-0">
    <!-- BEGIN: Side Menu -->
    <div th:replace="~{./fragments/nav}"></div>
    <!-- END: Side Menu -->
    <!-- BEGIN: Content -->
    <div class="content">
        <!-- BEGIN: Top Bar -->
        <div th:replace="~{./fragments/top}"></div>
        <!-- END: Top Bar -->
        <div class="intro-y flex justify-between mt-6">
            <div class="flex-1">
                <a class="btn btn-primary shadow-md" th:href="@{/members/memberReceipt/createReceipt/add}" data-tw-toggle="modal"
                   data-tw-target="#header-footer-modal-preview-view">
                    New Receipt
                </a>
            </div>
            <!-- Div with the button on the right -->
            <div class="flex items-center justify-end space-x-2 ml-3 mt-2">
                <div class="text-left">
                    <div class="flex mr-2 items-center">
                        <div class="font-medium">Filter Date From:-</div>
                    </div>
                </div>
                <div>
                    <label for="minDate">From:</label>
                    <input type="date" id="minDate" class="border p-2 rounded">

                    <label for="maxDate" class="ml-2">To:</label>
                    <input type="date" id="maxDate" class="border p-2 rounded">
                </div>
            </div>
        </div>
        <div class="grid grid-cols-12 gap-6 mt-5">
            <div class="intro-y col-span-12 lg:col-span-12">
                <!-- BEGIN: Responsive Table -->
                <div class="overflow-x-auto box">
                    <div class="m-5">
                        <table class="table" id="table">
                            <thead>
                            <tr>
                                <th class="whitespace-nowrap">Receipt ID</th>
                                <th class="whitespace-nowrap">Category</th>
                                <th class="whitespace-nowrap">Name</th>
                                <th class="whitespace-nowrap">Ticket No.</th>
                                <th class="whitespace-nowrap">Payment Type</th>
                                <th class="whitespace-nowrap">Total Amount</th>
                                <th class="whitespace-nowrap">Created At</th>
                                <th class="whitespace-nowrap">Details</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="mr : ${mReceipt}">
                                <td th:text="${mr.rId}">ID</td>
                                <td th:text="${mr.category}">Category</td>
                                <td th:text="${mr.name}">Name</td>
                                <td th:text="${mr.userId}">Ticket Number</td>
                                <td th:text="${mr.paymenttype}">Payment Type</td>
                                <td th:text="${mr.totalAmount}">totalAmount</td>
                                <td th:text="${mr.createdDate}">Created Date</td>
                                <td class="flex-1">
                                    <a class="btn btn-primary shadow-md" th:href="@{/members/memberReceipt/createReceipt/detail/{rId}(rId=${mr.rId})}"
                                       data-tw-toggle="modal" data-tw-target="#header-footer-modal-preview-view">
                                        Details
                                    </a>
                                    <a class="btn btn-danger ml-4 mt-1 delete-btn" href="javascript:;" data-tw-toggle="modal" data-tw-target="#delete-confirmation-modal" th:data-id="${mr.rId}">
                                        Delete</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- END: Responsive Table -->
            </div>
        </div>
    </div>
    <div id="delete-confirmation-modal" class="modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-body p-0">
                    <div class="p-5 text-center">
                        <i data-lucide="x-circle" class="w-16 h-16 text-danger mx-auto mt-3"></i>
                        <div class="text-3xl mt-5">Are you sure?</div>
                        <div class="text-slate-500 mt-2">
                            Do you really want to delete these records?
                            <br>This process cannot be undone.
                        </div>
                    </div>
                    <div class="px-5 pb-8 text-center">
                        <button type="button" data-tw-dismiss="modal" class="btn btn-outline-secondary w-24 mr-1">Cancel</button>
                        <a id="delete-confirm-btn" href="javascript:;" class="btn btn-danger w-24">Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- END: Content -->
</div>
<div th:replace="~{./fragments/footer}"></div>
<!-- BEGIN: JS Assets-->
<script src="/tcos/dist/js/app.js"></script>
<!-- Include jQuery and DataTables JS -->
<script src="/tcos/dist/js/jquery-3.7.0.min.js"></script>
<script src="/tcos/dist/js/jquery.dataTables1.13.5.min.js"></script>
<script>
    document.querySelectorAll('.delete-btn').forEach(function (button) {
        button.addEventListener('click', function () {
            const empId = this.getAttribute('data-id'); // Capture empId
            const deleteUrl = '/tcos/members/memberReceipt/createReceipt/delete/' + empId;
            document.getElementById('delete-confirm-btn').setAttribute('href', deleteUrl);
        });
    });
</script>
<script>
    $(document).ready(function () {
        var table = $('#table').DataTable({
            columnDefs: [
                {
                    targets: 6, // Updated Date column (0-based index)
                    render: function (data, type, row) {
                        if (!data) return '';
                        var date = new Date(data); // raw ISO yyyy-MM-dd
                        return date.toLocaleDateString('en-GB'); // dd/MM/yyyy
                    }
                }
            ]
        });

        // Filtering by date range
        $.fn.dataTable.ext.search.push(
            function (settings, data, dataIndex) {
                var min = $('#minDate').val();
                var max = $('#maxDate').val();
                var minDate = min ? new Date(min) : null;
                var maxDate = max ? new Date(max) : null;

                // Get raw ISO value from row (still yyyy-MM-dd)
                var rowData = table.row(dataIndex).data();
                var rowDateStr = rowData[6];
                var rowDate = rowDateStr ? new Date(rowDateStr) : null;

                if (!rowDate) return false;
                if (minDate && rowDate < minDate) return false;
                if (maxDate && rowDate > maxDate) return false;

                return true;
            }
        );

        $('#minDate, #maxDate').on('change', function () {
            table.draw();
        });
    });
</script>
</body>

</html>
