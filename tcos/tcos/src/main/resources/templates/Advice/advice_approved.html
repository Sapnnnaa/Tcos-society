<!DOCTYPE html>
<html lang="en" class="light" xmlns:th="http://www.w3.org/1999/xhtml">
<!-- BEGIN: Head -->

<head>
    <meta charset="utf-8">
    <link href="/tcos/dist/images/logo2.svg" rel="shortcut icon">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Approved Advice</title>
    <!-- BEGIN: CSS Assets-->
    <link rel="stylesheet" href="/tcos/dist/css/app.css" />
    <link rel="stylesheet" href="/tcos/dist/css/jquery.dataTables1.13.5.min.css">
    <script src="/tcos/dist/js/jquery-3.6.0.min.js"></script>
<!--    <script src="/tcos/dist/js/jquery.dataTables.min.js"></script>-->
    <!-- END: CSS Assets-->
</head>

<body class="overflow-x-auto py-5">
<!-- BEGIN: Mobile Menu -->

<!-- END: Mobile Menu -->
<div class="flex mt-[4.7rem] md:mt-0">
    <!-- BEGIN: Side Menu -->
    <div th:replace="~{./fragments/nav}"></div>
    <!-- END: Side Menu -->
    <!-- BEGIN: Content -->
    <div class="content">
        <!-- BEGIN: Top Bar -->
        <div th:replace="~{./fragments/top}"></div>
        <!-- END: Top Bar -->
        <div class="intro-y flex justify-between mt-6">
            <div class="flex-1">
                <h1 class=" font-medium mr-auto text-2xl">
                    Monitor Advice
                </h1>
            </div>
            <div class="flex items-center justify-end space-x-2 ml-3 mt-2">
                <div class="text-left">
                    <div class="flex mr-2 items-center">
                        <div class="font-medium">Filter Date From:-</div>
                    </div>
                </div>
                <div>
                    <label for="minDate">From:</label>
                    <input type="date" id="minDate" class="border p-2 rounded">

                    <label for="maxDate" class="ml-2">To:</label>
                    <input type="date" id="maxDate" class="border p-2 rounded">
                </div>
            </div>
        </div>
        <div class="grid grid-cols-12 gap-6 mt-5">
            <div class="intro-y col-span-12 lg:col-span-12">
                <!-- BEGIN: Responsive Table -->
                <div class="overflow-x-auto box">
                    <div class="m-5">
                        <table class="table" id="table">
                            <thead>
                            <tr>
                                <th class="whitespace-nowrap">Bond Number</th>
                                <th class="whitespace-nowrap">Bond UID</th>
                                <th class="whitespace-nowrap">Ticket Number</th>
                                <th class="whitespace-nowrap">Name</th>
                                <th class="whitespace-nowrap">Bank Name</th>
                                <th class="whitespace-nowrap">Bond Type</th>
                                <!--                                <th class="whitespace-nowrap">Account Number</th>-->
                                <th class="whitespace-nowrap">Amount</th>
                                <th class="whitespace-nowrap">Cheque Number</th>
                                <th class="whitespace-nowrap">Payment Type</th>
                                <!--                                <th class="whitespace-nowrap">Payment Bank</th>-->
                                <th class="whitespace-nowrap">Updated Date</th>
                                <th class="whitespace-nowrap">Bond Status</th>
                                <th class="whitespace-nowrap">Details</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="mv : ${mvoucher}">
                                <td th:text="${mv.bondId}">Bond Number</td>
                                <td th:text="${mv.gid}">Bond UID</td>
                                <td th:text="${mv.userId}">Ticket Number</td>
                                <td th:text="${mv.Name}">Name</td>
                                <td th:text="${mv.bname}">Bank Name</td>
                                <td th:text="${mv.bondType}">Bond Name</td>
                                <!--                                <td th:text="${mv.accountNum}">Account Number</td>-->
                                <td th:text="${mv.loanAmount}">Amount</td>
                                <td th:text="${mv.chequeNo}">Amount</td>
                                <td th:text="${mv.paymenttype}">Payment Type</td>
                                <!--                                <td th:text="${mv.paymentBank}">Payment Bank</td>-->
                                <td th:text="${mv.adviceApprovedDate}">Prepared Date</td>                                <td th:text="${mv.paymentStatus}">Status</td>
                                <td class="flex-1">
                                    <a class="btn btn-primary shadow-md" th:href="@{/members/advice/approvedAdvice/details/{Id}(Id=${mv.AdviceId})}"
                                       data-tw-toggle="modal" data-tw-target="#header-footer-modal-preview-view">
                                        Update
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- END: Responsive Table -->
            </div>
        </div>
    </div>
    <!-- END: Content -->
</div>
<div th:replace="~{./fragments/footer}"></div>
<!-- BEGIN: JS Assets-->
<script src="/tcos/dist/js/app.js"></script>
<!-- Include jQuery and DataTables JS -->
<script src="/tcos/dist/js/jquery-3.7.0.min.js"></script>
<script src="/tcos/dist/js/jquery.dataTables1.13.5.min.js"></script>
<script>
    $(document).ready(function () {
        var table = $('#table').DataTable({
            columnDefs: [
                {
                    targets: 9, // Updated Date column (0-based index)
                    render: function (data, type, row) {
                        if (!data) return '';
                        var date = new Date(data); // raw ISO yyyy-MM-dd
                        return date.toLocaleDateString('en-GB'); // dd/MM/yyyy
                    }
                }
            ]
        });

        // Filtering by date range
        $.fn.dataTable.ext.search.push(
            function (settings, data, dataIndex) {
                var min = $('#minDate').val();
                var max = $('#maxDate').val();
                var minDate = min ? new Date(min) : null;
                var maxDate = max ? new Date(max) : null;

                // Get raw ISO value from row (still yyyy-MM-dd)
                var rowData = table.row(dataIndex).data();
                var rowDateStr = rowData[9];
                var rowDate = rowDateStr ? new Date(rowDateStr) : null;

                if (!rowDate) return false;
                if (minDate && rowDate < minDate) return false;
                if (maxDate && rowDate > maxDate) return false;

                return true;
            }
        );

        $('#minDate, #maxDate').on('change', function () {
            table.draw();
        });
    });
</script>
</body>

</html>
