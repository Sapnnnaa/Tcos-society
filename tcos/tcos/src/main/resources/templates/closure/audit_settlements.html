   <script>      

        document.getElementById("generate_button").addEventListener("click", function () {
            triggerGeneratePdf(); // your actual function to download PDF
        });

        function triggerGeneratePdf() {
        	let ticketInput = document.getElementById("ticketNo");
        	
        	let ticketNo = ticketInput.value.trim();
           
        	ticketInput.value = "0";

               // Clear "0" when the user starts typing
               ticketInput.addEventListener("focus", function () {
                   if (ticketInput.value === "0") {
                	   ticketInput.value = "";
                   }
               });
               // Restore "0" if empty
               ticketInput.addEventListener("blur", function () {
                   if (ticketInput.value.trim() === "") {
                	   ticketInput.value = "0";
                   }
               });
            
            fetch('/tcos/members/generateauditpdf/' + ticketNo )
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.blob(); // Receive PDF as blob
                })
                .then(blob => {
                    // Create a link and trigger download
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'audit_settlement'+ ticketNo +".pdf";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                })
                .catch(error => {
                    console.error('Error generating PDF:', error);
                });
        }

        // Function to clean up "JS:xxx" from values
        function cleanData(value) {
            return value.toString().replace(/JS:\d+/g, '').trim();
        }
        

    </script>
