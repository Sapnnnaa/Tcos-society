<!DOCTYPE html>
<html lang="en" class="light" xmlns:th="http://www.w3.org/1999/xhtml">
<!-- BEGIN: Head -->
<head>
    <meta charset="utf-8">
    <link href="/tcos/dist/images/logo2.svg" rel="shortcut icon">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Membership Termination</title>
    <link rel="stylesheet" href="/tcos/dist/css/app.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
</head>

<!--</head>-->
<!-- END: Head -->
<body class="py-5">
<!-- BEGIN: Mobile Menu -->
<div th:insert="~{./fragments/mob}"></div>
<!-- END: Mobile Menu -->
<div class="flex mt-[4.7rem] md:mt-0">
    <div th:replace="~{./fragments/nav}"></div>
    <div class="content">
        <div th:replace="~{./fragments/top}"></div>
        <h2 class="intro-y text-lg font-medium mt-5">Member Registration</h2>
        <div class="box grid grid-cols-12 gap-6 mt-5 p-5 bg-white shadow-lg rounded-2xl">
            <div class="intro-y col-span-12 overflow-auto 2xl:overflow-visible">
                <table class="table table-report -mt-2" id="table">
                    <thead>
                    <tr>
                        <th class="whitespace-nowrap">User ID</th>
                        <th class="whitespace-nowrap">Name</th>
                        <th class="whitespace-nowrap">Phone Number</th>
                        <th class="text-center whitespace-nowrap">DOR</th>
                        <th class="text-center whitespace-nowrap">Account Status</th>
                        <th class="text-center whitespace-nowrap">Account Closure</th>
                        <th class="text-center whitespace-nowrap">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Thymeleaf iteration over users -->
                    <tr th:each="user : ${users}">
                        <td th:text="${user.userId}"></td>
                        <td th:text="${user.name}"></td>
                        <td th:text="${user.phoneNum}"></td>
                        <td th:text="${user.dor}"></td>
                        <td th:text="${user.accountStatus}"></td>
                        <td th:text="${user.accountSettlement}"></td>
                        <td>
                            <div class="flex gap-2">
                                <a
                                        th:href="@{/members/user_registration/updateUser/{empId}(empId=${user.empId})}"
                                        class="btn btn-primary flex items-center"
                                >
                                    <i data-lucide="check-square" class="w-6 h-4 mr-1"></i>Update
                                </a>
                                <a
                                        class="btn btn-danger flex items-center delete-btn"
                                        href="javascript:;"
                                        data-tw-toggle="modal"
                                        data-tw-target="#delete-confirmation-modal"
                                        th:data-id="${user.empId}"
                                >
                                    <i data-lucide="trash" class="w-6 h-4 mr-1"></i>Delete
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="delete-confirmation-modal" class="modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-body p-0">
                    <div class="p-5 text-center">
                        <i data-lucide="x-circle" class="w-16 h-16 text-danger mx-auto mt-3"></i>
                        <div class="text-3xl mt-5">Are you sure?</div>
                        <div class="text-slate-500 mt-2">
                            Do you really want to delete these records?
                            <br>This process cannot be undone.
                        </div>
                    </div>
                    <div class="px-5 pb-8 text-center">
                        <button type="button" data-tw-dismiss="modal" class="btn btn-outline-secondary w-24 mr-1">Cancel</button>
                        <a id="delete-confirm-btn" href="javascript:;" class="btn btn-danger w-24">Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{./fragments/footer}"></div>
<script>
    document.querySelectorAll('.delete-btn').forEach(function (button) {
        button.addEventListener('click', function () {
            const empId = this.getAttribute('data-id'); // Capture empId
            const deleteUrl = '/tcos/members/user_registration/deleteUser/' + empId;
            document.getElementById('delete-confirm-btn').setAttribute('href', deleteUrl);
        });
    });

</script>
<script src="/tcos/dist/js/app.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
<script>
    $(document).ready(function () {
        $('#table').DataTable();
    });
</script>
</body>
</html>
