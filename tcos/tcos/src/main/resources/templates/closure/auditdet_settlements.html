      .grid-container {

        1fr    /* Column 3: 1 fractional unit */

        1fr    /* Column 5: 1 fractional unit */
        5%     /* Column 6: 5% of container width */

    width: 100%; /* Ensures the grid spans the full width of its parent */
    border: 1px solid #ccc;
    padding: 10px;
}

.grid-item {

    padding: 10px;
    text-align: center;
}

<script>      

        document.getElementById("generate_summary").addEventListener("click", function () {
        	 const p_userId = $('#userId').val().trim();
             var p_audityear = $('#financial_year').val().trim();
             // alert(p_audityear);
              if (!p_userId) {
                  alert('Please enter a Ticket Number');
                  return;
              }
        	
        	triggerGeneratePdf(p_userId,p_audityear); // your actual function to download PDF
        });

        function triggerGeneratePdf(p_userId,p_audityear) {
                    
        	fetch(`/tcos/members/generateauditpdf/${p_userId}/${p_audityear}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.blob(); // Receive PDF as blob
                })
                .then(blob => {
                    // Create a link and trigger download
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'audit_settlement_summary'+ p_userId +".pdf";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                   
                })
                .catch(error => {
                    console.error('Error generating PDF:', error);
                });
        }

        // Function to clean up "JS:xxx" from values
        function cleanData(value) {
           return value.toString().replace(/JS:\d+/g, '').trim();
        }
        

    </script>

                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                   
                })
                .catch(error => {
                    console.error('Error generating PDF:', error);
                });
        }

        // Function to clean up "JS:xxx" from values
        function cleanData(value) {
           return value.toString().replace(/JS:\d+/g, '').trim();
        }
        

    </script>

</body>
