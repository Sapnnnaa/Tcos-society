<!DOCTYPE html>
<html lang="en" class="light" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <link href="/tcos/dist/images/logo2.svg" rel="shortcut icon">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Membership Report</title>

    <!-- BEGIN: CSS Assets -->
    <link rel="stylesheet" href="/tcos/dist/css/app.css" />
    <link rel="stylesheet" href="/tcos/dist/css/datatables2.3.4.min.css">
    <link rel="stylesheet" href="/tcos/dist/css/buttons.datatables.3.2.5.css">
   <style type="text/css">
     .table-container {
  /* Gives the container a fixed height and enables vertical scrolling */
  max-height: 300px;
  overflow-y: auto;
  /* Required for horizontal scrolling if needed */
  overflow-x: auto; 
  border: 1px solid #ccc;
}

table {
  width: 100%;
  border-collapse: collapse; /* Helps borders stay with sticky cells */
}

thead th {
  position: sticky;
  top: 0; /* Sticks the header to the top of the scrolling container */
  background-color: #f1f1f1; /* Add a background color so content doesn't show through */
  z-index: 1; /* Ensures the header appears above the table body content */
}

th, td {
  padding: 10px;
  text-align: left;
  border: 1px solid #ddd;
}
     
   </style>
     
</head>

<body class="overflow-x-auto py-5">

<div class="flex mt-[4.7rem] md:mt-0">
    <div th:replace="~{./fragments/nav}"></div>

    <div class="content">
        <div th:replace="~{./fragments/top}"></div>

        <div class="intro-y flex justify-between mt-6 items-start">
            <div class="flex-1">
                <h1 class="font-medium mr-auto text-2xl">MEMBERSHIP REPORT</h1>
            </div>
        </div>

        <div class="grid grid-cols-12 gap-6 mt-5">
            <div class="intro-y col-span-12 lg:col-span-12">
                <div class="mb-5 flex">
                    <!-- Dropdown for DOB / DOJ -->
                    <div>
                        <label for="dateFilterType">Filter By: </label>
                        <select id="dateFilterType" class="border p-2 rounded">
                            <option value="dob">DOB</option>
                            <option value="doj">DOJ</option>
                        </select>
                    </div>

                    <!-- Date Range Inputs -->
                    <div>
                        <label for="minDate">From:</label>
                        <input type="date" id="minDate" class="border p-2 rounded">

                        <label for="maxDate" class="ml-2">To:</label>
                        <input type="date" id="maxDate" class="border p-2 rounded">
                    </div>
                </div>

                <div class="overflow-x-auto box">
                    <div class="m-5">
                       <div class="table-container">
                         <table class="table" id="table">
                            <thead>
                            <tr>
                                <th class="whitespace-nowrap">Name</th>
                                <th class="whitespace-nowrap">Email</th>
                                <th class="whitespace-nowrap">Ticket No.</th>
                                <th class="whitespace-nowrap">Employee ID</th>
                                <th class="whitespace-nowrap">Gender</th>
                                <th class="whitespace-nowrap">Date of Birth</th>
                                <th class="whitespace-nowrap">Date of Joining</th>
                                <th class="whitespace-nowrap">AadharNo</th>
                                 <th class="whitespace-nowrap">PAN No.</th>
                               <th class="whitespace-nowrap">Phone No.</th>
<!--                                <th class="whitespace-nowrap">Balance/Contra</th>-->
<!--                                <th class="whitespace-nowrap">Transaction Date</th>-->
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="mr : ${membership}">
                                <td th:text="${mr.name}"></td>
                                <td th:text="${mr.email}"></td>
                                <td th:text="${mr.userId}"></td>
                                <td th:text="${mr.empId}"></td>
                                <td th:text="${mr.gender}"></td>
                                <td th:text="${#dates.format(mr.dob, 'dd-MM-yyyy')}"></td>
                                <td th:text="${#dates.format(mr.createdAt, 'dd-MM-yyyy')}"></td> <!-- FIXED HERE -->

                                <td th:text="${mr.aadharNumber}"></td>
                                <td th:text="${mr.panCard}"></td>
                                <td th:text="${mr.phoneNum}"></td>
<!--                                <td th:text="${mr.balance}">Balance</td>-->
<!--                                <td th:text="${mr.transactionDate}">Created Date</td>-->
                            </tr>
                            </tbody>
                        </table>
                       </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{./fragments/footer}"></div>

<!-- BEGIN: JS Assets -->
<script src="/tcos/dist/js/app.js"></script>
<script src="/tcos/dist/js/jquery-3.7.1.js"></script>
<script src="/tcos/dist/js/datatables.2.3.4.js"></script>
<script src="/tcos/dist/js/datatables.button.3.2.5.js"></script>
<script src="/tcos/dist/js/buttons.datatables.3.2.5.js"></script>
<script src="/tcos/dist/js/jszip.js"></script>
<script src="/tcos/dist/js/html5.buttons.js"></script>

<script>
    $(document).ready(function () {

        // Initialize DataTable (your original code kept same)
        var table = new DataTable('#table', {
            ordering: false,
            paging: true,
            pageLength: 10,
            lengthMenu: [5, 10, 25, 50, 100],
            layout: {
                topStart: {
                    buttons:[
                        'pageLength',
                        {
                            extend: 'excelHtml5',
                            text: 'Export to Excel',
                            customize: function (xlsx) {
                                var sheet = xlsx.xl.worksheets['sheet1.xml'];
                                sheet.querySelectorAll('row c[r^="C"]').forEach((el) => {
                                    el.setAttribute('s', '2');
                                });
                            }
                        }
                    ]
                }
            }
        });

        // --------------------------------------------------------------------
        // SEARCH FILTER (Name, Email, Ticket No, Emp ID)
        // --------------------------------------------------------------------
        var searchableCols = [0, 1, 2, 3];

        $.fn.dataTable.ext.search.push(function(settings, data) {
            var searchTerm = $('#table_filter input').val()?.toLowerCase() || '';
            if (!searchTerm) return true;

            return searchableCols.some(function(colIndex) {
                return (data[colIndex] || '').toLowerCase().includes(searchTerm);
            });
        });

        $('#table_filter input').on('keyup', function() {
            table.draw();
        });


        // --------------------------------------------------------------------
        // Convert dd-MM-yyyy → Date() format
        // --------------------------------------------------------------------
        function parseDMY(dateStr) {
            if (!dateStr) return null;

            var parts = dateStr.split("-");
            if (parts.length !== 3) return null;

            var day = parts[0];
            var month = parts[1];
            var year = parts[2];

            // return new Date(${year}-${month}-${day});  // yyyy-MM-dd
           return new Date(+year, +month - 1 , +day);
        }


        // --------------------------------------------------------------------
        // DATE FILTERING (option = DOB / DOJ)
        // --------------------------------------------------------------------
        $.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {

            var type = $('#dateFilterType').val(); // dob OR doj
            var min = $('#minDate').val();
            var max = $('#maxDate').val();

            var minDate = min ? new Date(min) : null;
            var maxDate = max ? new Date(max) : null;

            var row = table.row(dataIndex).data();

            var dob = parseDMY(row[5]); // DOB column
            var doj = parseDMY(row[6]); // DOJ column

            if (type === "dob") {
                if (!dob) return false;
                if (minDate && dob < minDate) return false;
                if (maxDate && dob > maxDate) return false;
                return true;
            }

            if (type === "doj") {
                if (!doj) return false;
                if (minDate && doj < minDate) return false;
                if (maxDate && doj > maxDate) return false;
                return true;
            }

            return true;
        });


        // Trigger filter on date change & dropdown change
        $('#minDate, #maxDate, #dateFilterType').on('change', function () {
            table.draw();
        });

    });
</script>

</body>
</html>
