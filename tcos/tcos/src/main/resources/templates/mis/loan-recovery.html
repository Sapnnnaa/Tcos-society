<!DOCTYPE html>
<html lang="en" class="light" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <link href="/tcos/dist/images/logo2.svg" rel="shortcut icon">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loan&RecoveryReport</title>

    <!-- BEGIN: CSS Assets -->
    <link rel="stylesheet" href="/tcos/dist/css/app.css" />
    <link rel="stylesheet" href="/tcos/dist/css/datatables2.3.4.min.css">
    <link rel="stylesheet" href="/tcos/dist/css/buttons.datatables.3.2.5.css">
 <style type="text/css">
     .table-container {
  /* Gives the container a fixed height and enables vertical scrolling */
  max-height: 400px;
  overflow-y: auto;
  /* Required for horizontal scrolling if needed */
  overflow-x: auto; 
  border: 1px solid #ccc;
}

table {
  width: 100%;
  border-collapse: collapse; /* Helps borders stay with sticky cells */
}

thead th {
  position: sticky;
  top: 0; /* Sticks the header to the top of the scrolling container */
  background-color: #f1f1f1; /* Add a background color so content doesn't show through */
  z-index: 1; /* Ensures the header appears above the table body content */
}

th, td {
  padding: 10px;
  text-align: left;
  border: 1px solid #ddd;
}
     
   </style>
     
</head>

<body class="overflow-x-auto py-5">

<div class="flex mt-[4.7rem] md:mt-0">
    <div th:replace="~{./fragments/nav}"></div>

    <div class="content">
        <div th:replace="~{./fragments/top}"></div>

        <div class="intro-y flex justify-between mt-6 items-start">
            <div class="flex-1">
                <h1 class="font-medium mr-auto text-2xl">LOAN & RECOVERY REPORT</h1>
            </div>
        </div>

        <div class="grid grid-cols-12 gap-6 mt-5">
            <div class="intro-y col-span-12 lg:col-span-12">
                <div class="mb-5 flex">
                    <div>
                        <label for="minDate">From:</label>
                        <input type="date" id="minDate" class="border p-2 rounded">
                        <label for="maxDate" class="ml-2">To:</label>
                        <input type="date" id="maxDate" class="border p-2 rounded">
                    </div>
                </div>

                <div class="overflow-x-auto box">
                    <div class="m-5">
                      <div class="table-container">
                        <table class="table" id="table">
                            <thead>
                            <tr>
                                <th class="whitespace-nowrap">Member Name</th>
                                <th class="whitespace-nowrap">Ticket No.</th>
                                <th class="whitespace-nowrap">Loan Amount</th>
                                <th class="whitespace-nowrap">Loan Type</th>
                                <th class="whitespace-nowrap">Apply Date</th>
                                <th class="whitespace-nowrap">Loan Recovery</th>
                                <th class="whitespace-nowrap">Loan Deposit</th>
                                <th class="whitespace-nowrap">Loan Balance</th>
                                <th class="whitespace-nowrap">Loan Status</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="mr : ${loans}">
                                <td th:text="${mr.Name}"></td> <!-- Member Name -->
                                <td th:text="${mr.userId}"></td>     <!-- Ticket No -->
                                <td th:text="${mr.loanAmount}"></td> <!-- Loan Amount -->
                                <td th:text="${mr.loantypevalue}"></td>   <!-- Loan Type -->

                                <!-- Apply Date (DATE) -->
                                <!--<td th:text="${#dates.format(mr.loanApplyDate, 'dd-MM-yyyy')}"></td>-->
                                  <td th:text="${mr.loanApplyDate}"></td> 
                                <!-- Loan Repaid (NUMBER — DO NOT FORMAT AS DATE!) -->
                                <td th:text="${mr.loanRepaid}"></td>
                                 <td th:text="${mr.loandeposit}"></td>

                                <!-- Loan Balance -->
                                <td th:text="${mr.loanBalance}"></td>

                                <!-- Loan Status -->
                                <td th:text="${mr.loanStatusType}"></td>
                            </tr>
                            </tbody>

                        </table>
                      </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{./fragments/footer}"></div>

<!-- BEGIN: JS Assets -->
<script src="/tcos/dist/js/app.js"></script>
<script src="/tcos/dist/js/jquery-3.7.1.js"></script>
<script src="/tcos/dist/js/datatables.2.3.4.js"></script>
<script src="/tcos/dist/js/datatables.button.3.2.5.js"></script>
<script src="/tcos/dist/js/buttons.datatables.3.2.5.js"></script>
<script src="/tcos/dist/js/jszip.js"></script>
<script src="/tcos/dist/js/html5.buttons.js"></script>

<script>
   var table = new DataTable('#table', {
    ordering: false,
    paging: true,
    pageLength: 10,
    lengthMenu: [5, 10, 25, 50, 100],
    layout: {
        topStart: {
            buttons: [
                'pageLength',
                {
                    extend: 'excelHtml5',
                    text: 'Export to Excel'
                }
            ]
        }
    },

    columnDefs: [
        {
            targets: 4,  // Apply Date column index
            render: function (data) {
                if (!data) return '';
                return new Date(data).toLocaleDateString('en-GB');
            }
        }
    ]
});

   // --------------------------------------------------------------------
   // Convert dd-MM-yyyy → Date() format
   // --------------------------------------------------------------------
   function parseDMY(dateStr) {
       if (!dateStr) return null;

       var parts = dateStr.split("-");
       if (parts.length !== 3) return null;

       var day = parts[0];
       var month = parts[1];
       var year = parts[2];

       // return new Date(${year}-${month}-${day});  // yyyy-MM-dd
      return new Date(+year, +month - 1 , +day);
   }
// DATE RANGE FILTERING
$.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {

    var min = $('#minDate').val();
    var max = $('#maxDate').val();

    var minDate = min ? new Date(min) : null;
    var maxDate = max ? new Date(max) : null;
    
    var rowData = table.row(dataIndex).data();
    
    var rowDateStr = rowData[4]; // Apply Date column
    
    var rowDate = rowDateStr ? new Date(rowDateStr) : null;
    
    if (!rowDate) return false;
    if (minDate && rowDate < minDate) return false;
    if (maxDate && rowDate > maxDate) return false;

    return true;
});

$('#minDate, #maxDate').on('change', function () {
    table.draw();
});

</script>
</body>
</html>
