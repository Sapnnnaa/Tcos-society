<!DOCTYPE html>
<html lang="en" class="light" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
 <meta charset="utf-8">
    <link href="/tcos/dist/images/logo2.svg" rel="shortcut icon">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Receipt Status Report</title>
    <!-- BEGIN: CSS Assets -->
    <link rel="stylesheet" href="/tcos/dist/css/app.css" />
    <link rel="stylesheet" href="/tcos/dist/css/datatables2.3.4.min.css">
    <link rel="stylesheet" href="/tcos/dist/css/buttons.datatables.3.2.5.css">
<style type="text/css">
     .table-container {
  /* Gives the container a fixed height and enables vertical scrolling */
  max-height: 400px;
  overflow-y: auto;
  /* Required for horizontal scrolling if needed */
  overflow-x: auto; 
  border: 1px solid #ccc;
}

table {
  width: 100%;
  border-collapse: collapse; /* Helps borders stay with sticky cells */
}

thead th {
  position: sticky;
  top: 0; /* Sticks the header to the top of the scrolling container */
  background-color: #f1f1f1; /* Add a background color so content doesn't show through */
  z-index: 1; /* Ensures the header appears above the table body content */
}

th, td {
  padding: 10px;
  text-align: left;
  border: 1px solid #ddd;
}
     
   </style>
</head>
<body>
 <div class="flex mt-[4.7rem] md:mt-0">
    <div th:replace="~{./fragments/nav}"></div>

    <div class="content">
        <div th:replace="~{./fragments/top}"></div>

        <div class="intro-y flex justify-between mt-6 items-start">
            <div class="flex-1">
                <h1 class="font-medium mr-auto text-2xl">RECEIPT STATUS REPORTS</h1>
            </div>
        </div>

        <div class="grid grid-cols-12 gap-6 mt-5">
            <div class="intro-y col-span-12 lg:col-span-12">
                <div class="mb-5 flex">
                      <div>
			             <label for="dateFilterType">Account N0: </label>
			               <select id="accountSelect" class="border p-2 rounded">
			                  <option value="">Please select a status</option>
			                   <option value="Receipts made">Receipts made</option>
			                   <option value="Receipts posted">Receipts posted</option>
			                   <option value="Receipts cleared">Receipts cleared</option>		                   
			                  
			               </select> 
                     <!--<input type="number" id="Account" name="Account" >-->

                     </div>
                    <div>
                        <label for="minDate">From:</label>
                        <input type="date" id="minDate" class="border p-2 rounded">
                        <label for="maxDate" class="ml-2">To:</label>
                        <input type="date" id="maxDate" class="border p-2 rounded">
                    </div>
                </div>

                <div class="overflow-x-auto box">
                    <div class="m-5">
                      <div class="table-container">
                        <table class="table" id="table">
                            <thead>
                            <tr>
                                <th class="whitespace-nowrap">Member Name</th>
                                <th class="whitespace-nowrap">Ticket no.</th>
                                <th class="whitespace-nowrap">Receipt ID</th>
                                <th class="whitespace-nowrap">Payment Bank</th>
                                <th class="whitespace-nowrap">Account No.</th>
                                <th class="whitespace-nowrap">Cheque No/ UTR</th>
                                <th class="whitespace-nowrap">Payment Type</th>
                                <th class="whitespace-nowrap">Total Amount</th>
                                <th class="whitespace-nowrap">Payment Received</th>
                                <th class="whitespace-nowrap">Date Created</th>
                                <th class="whitespace-nowrap">Receipt Status</th>
                                <th class="whitespace-nowrap">GL Name</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="mr : ${receipts}">
                                <td th:text="${mr.memberName}"></td>
                                <td th:text="${mr.userId}"></td>
                                <td th:text="${mr.receiptId}"></td>
                                <td th:text="${mr.paymentBank}"></td>
                                <td th:text="${mr.accountNo}"></td>
                                <td th:text="${mr.chequeNo}"></td>
                                <td th:text="${mr.paymentTypeEnum}"></td>
                                <td th:text="${mr.totalAmount}"></td>
                                <td th:text="${mr.paymentReceived}"></td>
                                <td th:text="${#dates.format(mr.createdAt, 'yyyy-MM-dd')}"></td>
                                <td th:text="${mr.GLcode}"></td>
                                <td th:text="${mr.GLname}"></td>
                            </tr>

                            </tbody>
                        </table>
                    </div>
                  </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{./fragments/footer}"></div>

<!-- BEGIN: JS Assets -->
<script src="/tcos/dist/js/app.js"></script>
<script src="/tcos/dist/js/jquery-3.7.1.js"></script>
<script src="/tcos/dist/js/datatables.2.3.4.js"></script>
<script src="/tcos/dist/js/datatables.button.3.2.5.js"></script>
<script src="/tcos/dist/js/buttons.datatables.3.2.5.js"></script>
<script src="/tcos/dist/js/jszip.js"></script>
<script src="/tcos/dist/js/html5.buttons.js"></script>

<script>
$(document).ready(function () {

    var dateColIndex = 9;  // Correct index

    var table = new DataTable('#table', {
        ordering: false,
        paging: true,
        pageLength: 10,
        lengthMenu: [5, 10, 25, 50, 100],
        layout: {
            topStart: {
                buttons: [
                    'pageLength',
                    {
                        extend: 'excelHtml5',
                        text: 'Export to Excel'
                    }
                ]
            }
        },
        columnDefs: [
            {
                targets: dateColIndex,
                render: function (data) {
                    if (!data) return '';
                    var d = new Date(data);
                    if (isNaN(d.getTime())) return data;
                    return d.toLocaleDateString('en-GB');
                }
            }
        ]
    });

    // SEARCHABLE COLUMNS (0–9 only)
    var searchableCols = [0, 1, 2, 3, 5, 6];

    $.fn.dataTable.ext.search.push(function(settings, data) {
        var searchTerm = $('#table_filter input').val()?.toLowerCase() || '';
        if (!searchTerm) return true;

        return searchableCols.some(function(colIndex) {
            return (data[colIndex] || '').toLowerCase().includes(searchTerm);
        });
    });

    $('#table_filter input').on('keyup', function() {
        table.draw();
    });

    // DATE FILTER
   $.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {

    var min = $('#minDate').val();
    var max = $('#maxDate').val();
    
    var selectedAccount = $('#accountSelect').val();

    var minDate = min ? new Date(min) : null;
    var maxDate = max ? new Date(max) : null;
    
    var rowData = table.row(dataIndex).data();
    
    var rowDateStr = rowData[9]; // Apply Date column
    
    var selecteddata = rowData[10];
    
    var rowDate = rowDateStr ? new Date(rowDateStr) : null;
    
    if (!rowDate) return false;
    if (minDate && rowDate < minDate) return false;
    if (maxDate && rowDate > maxDate) return false;

    if (selectedAccount === "" || selecteddata === selectedAccount) {
        return true;
    }
});

    $('#accountSelect,#minDate, #maxDate').on('change', function () {
        table.draw();
    });

});
</script>
</body>
</html>
