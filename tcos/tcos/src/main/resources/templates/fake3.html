<!DOCTYPE html>
<html lang="en" class="light" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <link href="/static/dist/images/logo2.svg" rel="shortcut icon">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transaction History</title>

    <!-- BEGIN: CSS Assets -->
    <link rel="stylesheet" href="/static/dist/css/app.css" />
    <link rel="stylesheet" href="/static/dist/css/datatables2.3.4.min.css">
    <link rel="stylesheet" href="/static/dist/css/buttons.datatables.3.2.5.css">
</head>

<body class="overflow-x-auto py-5">

<div class="flex mt-[4.7rem] md:mt-0">
    <div th:replace="~{./fragments/nav}"></div>

    <div class="content">
        <div th:replace="~{./fragments/top}"></div>

        <div class="intro-y flex justify-between mt-6 items-start">
            <div class="flex-1">
                <h1 class="font-medium mr-auto text-2xl">TRANSACTION HISTORY</h1>
            </div>
        </div>

        <div class="grid grid-cols-12 gap-6 mt-5">
            <div class="intro-y col-span-12 lg:col-span-12">
                <div class="mb-5 flex">
                    <div>
                        <label for="minDate">From:</label>
                        <input type="date" id="minDate" class="border p-2 rounded">
                        <label for="maxDate" class="ml-2">To:</label>
                        <input type="date" id="maxDate" class="border p-2 rounded">
                    </div>
                </div>

                <div class="overflow-x-auto box">
                    <div class="m-5">
                        <table class="table" id="table">
                            <thead>
                            <tr>
                                <th class="whitespace-nowrap">Transaction ID</th>
                                <th class="whitespace-nowrap">Transaction GL a/c</th>
                                <th class="whitespace-nowrap">Category</th>
                                <th class="whitespace-nowrap">Name</th>
                                <th class="whitespace-nowrap">Ticket No.</th>
                                <th class="whitespace-nowrap">Transaction Type</th>
                                <th class="whitespace-nowrap">Payment Type</th>
                                <th class="whitespace-nowrap">Payment Bank</th>
                                <th class="whitespace-nowrap">Cheque NO/ UTR</th>
                                <th class="whitespace-nowrap">Amount</th>
                                <th class="whitespace-nowrap">Balance/Contra</th>
                                <th class="whitespace-nowrap">Transaction Date</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="mr : ${bankbook}">
                                <td th:text="${mr.transactionId}">ID</td>
                                <td th:text="${mr.transactionName}">Name</td>
                                <td th:text="${mr.category}">Category</td>
                                <td th:text="${mr.name}">Name</td>
                                <td th:text="${mr.userId}">Ticket Number</td>
                                <td th:text="${mr.leasuretype}">Leisure Type</td>
                                <td th:text="${mr.paymenttype}">Payment Type</td>
                                <td th:text="${mr.paymentBank}">paymentBank</td>
                                <td th:text="${mr.uniqueId}">Cheque</td>
                                <td th:text="${mr.amount}">Amount</td>
                                <td th:text="${mr.balance}">Balance</td>
                                <td th:text="${mr.transactionDate}">Created Date</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{./fragments/footer}"></div>

<!-- BEGIN: JS Assets -->
<script src="/static/dist/js/app.js"></script>
<script src="/static/dist/js/jquery-3.7.1.js"></script>
<script src="/static/dist/js/datatables.2.3.4.js"></script>
<script src="/static/dist/js/datatables.button.3.2.5.js"></script>
<script src="/static/dist/js/buttons.datatables.3.2.5.js"></script>
<script src="/static/dist/js/jszip.js"></script>
<script src="/static/dist/js/html5.buttons.js"></script>

<script>
    $(document).ready(function () {
        // Initialize DataTable
        var table = new DataTable('#table', {
            ordering: false, // disable column sorting
            paging: true,
            pageLength: 10,
            lengthMenu: [5, 10, 25, 50, 100],
            layout: {
                topStart: {
                    buttons:[
                        'pageLength',
                        {
                            extend: 'excelHtml5',
                            text: 'Export to Excel',
                            customize: function (xlsx) {
                                var sheet = xlsx.xl.worksheets['sheet1.xml'];
                                sheet.querySelectorAll('row c[r^="C"]').forEach((el) => {
                                    el.setAttribute('s', '2');
                                });
                            }
                        }
                    ]
                }
            },

            columnDefs: [
                {
                    targets: 11, // Prepared Date column (0-based index)
                    render: function (data) {
                        if (!data) return '';
                        var date = new Date(data);
                        return date.toLocaleDateString('en-GB'); // dd/MM/yyyy
                    }
                }
            ]
        });

        // Custom Global Search – limit to specific columns
        var searchableCols = [0, 1, 3, 4]; // VOC Number, VOC UID, Ticket Number, Name

        $.fn.dataTable.ext.search.push(function(settings, data) {
            var searchTerm = $('#table_filter input').val()?.toLowerCase() || '';
            if (!searchTerm) return true;

            return searchableCols.some(function(colIndex) {
                return (data[colIndex] || '').toLowerCase().includes(searchTerm);
            });
        });

        $('#table_filter input').on('keyup', function() {
            table.draw();
        });

        // Date range filtering
        $.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {
            var min = $('#minDate').val();
            var max = $('#maxDate').val();
            var minDate = min ? new Date(min) : null;
            var maxDate = max ? new Date(max) : null;

            var rowData = table.row(dataIndex).data();
            var rowDateStr = rowData[11];
            var rowDate = rowDateStr ? new Date(rowDateStr) : null;

            if (!rowDate) return false;
            if (minDate && rowDate < minDate) return false;
            if (maxDate && rowDate > maxDate) return false;

            return true;
        });

        $('#minDate, #maxDate').on('change', function () {
            table.draw();
        });
    });
</script>
</body>
</html>
